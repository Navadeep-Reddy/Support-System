[project]
name = "aatra-support-agent"
version = "0.1.0"
description = "Backend for the Aatra AI support agent demo"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.34,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "psycopg[binary,pool]>=3.2,<4.0",
  "pgvector>=0.3,<1.0",
  "pydantic-settings>=2.7,<3.0",
  "python-dotenv>=1.0,<2.0",
  "itsdangerous>=2.2,<3.0",
  "langgraph>=0.2,<2.0",
  "langgraph-checkpoint-postgres>=2.0,<4.0",
  "langchain-nvidia-ai-endpoints>=0.3,<1.0",
  "langsmith>=0.2,<1.0",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1.0",
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.25,<2.0",
  "ruff>=0.9,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/support_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
